<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sotto</title>
    <link rel="stylesheet" href="popup.css" />
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <main class="panel">
      <header class="head">
        <img class="favicon" id="tab-icon" alt="" width="16" height="16" hidden />
        <p class="head__title" id="tab-title"></p>
        <span class="status" id="status" data-state="idle"></span>
      </header>

      <section class="control" aria-labelledby="volume-label">
        <h1 class="sr-only" id="volume-label" data-i18n="volume"></h1>
        <p class="readout" id="readout">
          <output id="volume-value" for="volume">100</output><span class="readout__unit">%</span>
          <span
            class="limiter"
            id="limiter"
            data-i18n="limiter"
            data-i18n-title="limiterHint"
            hidden
          ></span>
        </p>
        <div class="slider-wrap">
          <input class="slider" id="volume" type="range" aria-labelledby="volume-label" />
        </div>
        <div class="actions">
          <button
            class="btn"
            id="mono"
            type="button"
            aria-pressed="false"
            data-i18n-title="monoHint"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 15v-3a8 8 0 0 1 16 0v3" />
              <rect x="3" y="14" width="4.5" height="6.5" rx="1.5" />
              <rect x="16.5" y="14" width="4.5" height="6.5" rx="1.5" />
            </svg>
            <span data-i18n="mono"></span>
          </button>
          <button
            class="btn"
            id="night"
            type="button"
            aria-pressed="false"
            data-i18n-title="nightHint"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z" />
            </svg>
            <span data-i18n="night"></span>
          </button>
          <button class="btn" id="reset" type="button" data-i18n-title="resetHint">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1" />
              <path d="M3.5 4v5h5" />
            </svg>
            <span data-i18n="reset"></span>
          </button>
          <button class="btn" id="release" type="button" data-i18n-title="releaseHint">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3v8" />
              <path d="M6.3 7.3a8 8 0 1 0 11.4 0" />
            </svg>
            <span data-i18n="release"></span>
          </button>
        </div>
        <div class="balance">
          <span class="balance__side" data-i18n="left" aria-hidden="true"></span>
          <div class="slider-wrap">
            <input
              class="slider slider--mini slider--balance"
              id="balance"
              type="range"
              data-i18n-label="balance"
              data-i18n-title="balanceHint"
            />
          </div>
          <span class="balance__side" data-i18n="right" aria-hidden="true"></span>
        </div>
      </section>

      <p class="notice" id="notice" role="status" hidden></p>

      <section class="others" id="others" hidden>
        <h2 class="others__title" data-i18n="otherTabs"></h2>
        <ul class="others__list" id="other-list"></ul>
      </section>

      <footer class="foot">
        <button class="link-btn" id="shortcuts" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="2.5" y="6" width="19" height="12" rx="2" />
            <path d="M6.5 10h.01M10.5 10h.01M14.5 10h.01M17.5 10h.01M7.5 14h9" />
          </svg>
          <span data-i18n="shortcuts"></span>
        </button>
      </footer>
    </main>

    <template id="other-row">
      <li class="row">
        <button class="row__tab" type="button" data-i18n-title="goToTab">
          <img class="favicon" alt="" width="16" height="16" hidden />
          <span class="row__title"></span>
        </button>
        <span class="row__value"></span>
        <button
          class="icon-btn"
          type="button"
          data-i18n-title="releaseTab"
          data-i18n-label="releaseTab"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17" /></svg>
        </button>
        <div class="slider-wrap row__slider">
          <input class="slider slider--mini" type="range" />
        </div>
      </li>
    </template>
  </body>
</html>
