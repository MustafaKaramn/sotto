<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Sotto small promo tile</title>
    <style>
      html,
      body {
        width: 440px;
        height: 280px;
        margin: 0;
        overflow: hidden;
      }

      body {
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 12px;
        background:
          radial-gradient(320px 220px at 50% 30%, rgb(91 91 214 / 0.5), transparent 70%),
          linear-gradient(160deg, #17172e, #0e0e1a);
        color: #f2f2f8;
        font-family: system-ui, 'Segoe UI', sans-serif;
        text-align: center;
      }

      img {
        width: 84px;
        height: 84px;
      }

      h1 {
        margin: 0;
        font-size: 40px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      p {
        margin: 0;
        color: #b8b8d0;
        font-size: 17px;
      }
    </style>
  </head>
  <body>
    <img src="/src/icons/icon-128.png" alt="" />
    <h1>Sotto</h1>
    <p>Tab volume, done right.</p>
  </body>
</html>
